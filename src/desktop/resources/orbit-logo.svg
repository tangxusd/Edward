<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Orbit 品牌 Logo — macOS 26 极简黑底白字</title>
  <desc>黑色连续曲线圆角（squircle）底板，白色细线轨道环与绕行星球为主体图形，下方对应 Orbit 白色无衬线字样；整体极简、象征轨道/卫星在空间中运行的动势</desc>
  <defs>
    <!-- 黑板：近黑到深灰的极简层次 -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#161619"/>
    </linearGradient>
    <!-- 底部微反光：玻璃下缘受光 -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <!-- 整块浮起投影 -->
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="36" stdDeviation="48" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <!-- 白色图形贴面轻投影 -->
    <filter id="markShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <!-- macOS 连续曲线圆角裁剪区 -->
    <clipPath id="squircleClip">
      <path d="M512 88C664.6 88 697.5 92.4 744.6 104.6C791.7 116.8 821.9 133.7 851.1 157.6C880.2 181.5 900.8 206.2 915.7 244.7C930.6 283.3 936 311 936 435.8L936 588.2C936 713 930.6 740.7 915.7 779.3C900.8 817.8 880.2 842.5 851.1 866.4C821.9 890.3 791.7 907.2 744.6 919.4C697.5 931.6 664.6 936 512 936C359.4 936 326.5 931.6 279.4 919.4C232.3 907.2 202.1 890.3 172.9 866.4C143.8 842.5 123.2 817.8 108.3 779.3C93.4 740.7 88 713 88 588.2L88 435.8C88 311 93.4 283.3 108.3 244.7C123.2 206.2 143.8 181.5 172.9 157.6C202.1 133.7 232.3 116.8 279.4 104.6C326.5 92.4 359.4 88 512 88Z"/>
    </clipPath>
  </defs>

  <!-- 整块图标 -->
  <g filter="url(#iconShadow)">
    <!-- 黑色 squircle 底板 -->
    <path d="M512 88C664.6 88 697.5 92.4 744.6 104.6C791.7 116.8 821.9 133.7 851.1 157.6C880.2 181.5 900.8 206.2 915.7 244.7C930.6 283.3 936 311 936 435.8L936 588.2C936 713 930.6 740.7 915.7 779.3C900.8 817.8 880.2 842.5 851.1 866.4C821.9 890.3 791.7 907.2 744.6 919.4C697.5 931.6 664.6 936 512 936C359.4 936 326.5 931.6 279.4 919.4C232.3 907.2 202.1 890.3 172.9 866.4C143.8 842.5 123.2 817.8 108.3 779.3C93.4 740.7 88 713 88 588.2L88 435.8C88 311 93.4 283.3 108.3 244.7C123.2 206.2 143.8 181.5 172.9 157.6C202.1 133.7 232.3 116.8 279.4 104.6C326.5 92.4 359.4 88 512 88Z" fill="url(#boardGrad)"/>

    <!-- 玻璃质感（裁剪在底板内） -->
    <g clip-path="url(#squircleClip)">
      <!-- 顶部极淡高光 -->
      <ellipse cx="512" cy="16" rx="820" ry="300" fill="#FFFFFF" opacity="0.05"/>
      <!-- 底部玻璃反光带 -->
      <rect x="0" y="840" width="1024" height="184" fill="url(#rimGrad)"/>
    </g>

    <!-- 玻璃边缘亮线：极细，左上微亮 -->
    <path d="M512 88C664.6 88 697.5 92.4 744.6 104.6C791.7 116.8 821.9 133.7 851.1 157.6C880.2 181.5 900.8 206.2 915.7 244.7C930.6 283.3 936 311 936 435.8L936 588.2C936 713 930.6 740.7 915.7 779.3C900.8 817.8 880.2 842.5 851.1 866.4C821.9 890.3 791.7 907.2 744.6 919.4C697.5 931.6 664.6 936 512 936C359.4 936 326.5 931.6 279.4 919.4C232.3 907.2 202.1 890.3 172.9 866.4C143.8 842.5 123.2 817.8 108.3 779.3C93.4 740.7 88 713 88 588.2L88 435.8C88 311 93.4 283.3 108.3 244.7C123.2 206.2 143.8 181.5 172.9 157.6C202.1 133.7 232.3 116.8 279.4 104.6C326.5 92.4 359.4 88 512 88Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="5"/>

    <!-- 错位渐变式 O：外层纯白环 + 内层灰色斜弧段，中心空心 -->
    <g filter="url(#markShadow)">
      <g transform="translate(512 512) scale(0.7) translate(-512 -512)">
        <!-- 内层灰色斜弧段 -->
        <path d="M608.35 260.24c139.04 0 251.76 112.72 251.76 251.76S747.39 763.76 608.35 763.76c-138.29 0-250.52-111.48-251.75-249.48 1.22 84.78 70.32 153.12 155.4 153.12 85.82 0 155.41-69.57 155.41-155.41S597.82 356.59 512 356.59c-85.08 0-154.18 68.34-155.4 153.12 1.23-137.99 113.46-249.47 251.75-249.47z" fill="#8A8A8F"/>
        <!-- 外层纯白环 -->
        <path d="M860.12 512c0-139.05-112.73-251.76-251.76-251.76-138.29 0-250.52 111.48-251.75 249.48-0.01 0.76-0.01 1.53-0.01 2.29s0 1.53 0.01 2.29c1.23 137.99 113.46 249.48 251.75 249.48 139.03-0.02 251.76-112.73 251.76-251.78 0 192.26-155.87 348.12-348.12 348.12-192.26 0-348.12-155.86-348.12-348.12S319.74 163.88 512 163.88c192.25 0 348.12 155.86 348.12 348.12z" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
</svg>