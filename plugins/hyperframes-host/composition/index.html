<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body,#root{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}#root{display:grid;place-items:center}.card{width:520px;height:320px;border-radius:24px;background:#151515;position:relative;overflow:hidden;box-shadow:0 0 28px rgba(0,0,0,.55)}.border{position:absolute;inset:-80%;background:conic-gradient(transparent 0deg 274deg,#ff6633 290deg,#fff2e8 306deg,#ff9966 322deg,transparent 340deg 360deg);animation:spin 3.2s linear infinite}.surface{position:absolute;inset:3px;border-radius:21px;background:#151515}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body><main id="root"><section class="card"><div class="border"></div><div class="surface"></div></section></main></body></html>
