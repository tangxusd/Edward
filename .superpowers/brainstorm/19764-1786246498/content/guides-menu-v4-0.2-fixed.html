<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>参考线菜单 — Edward 0.2.0</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111; color: #d9d9d9; font-size: 12px; }
    .preview { position: relative; width: min(920px, calc(100vw - 48px)); aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid #3b3b3b; border-radius: 7px; background: #202020; }
    .canvas { position: absolute; inset: 74px 72px 52px 90px; overflow: hidden; background: #090909; border: 1px solid #4a4a4a; }
    .ruler-top { position: absolute; top: -22px; right: 0; left: 0; height: 21px; border-bottom: 1px solid #555; background: repeating-linear-gradient(to right, transparent 0 7px, #5f5f5f 7px 8px, transparent 8px 15px), repeating-linear-gradient(to right, transparent 0 47px, #858585 47px 48px, transparent 48px 95px); }
    .ruler-left { position: absolute; top: 0; bottom: 0; left: -22px; width: 21px; border-right: 1px solid #555; background: repeating-linear-gradient(to bottom, transparent 0 7px, #5f5f5f 7px 7px, transparent 8px 15px), repeating-linear-gradient(to bottom, transparent 0 47px, #858585 47px 48px, transparent 48px 95px); }
    .guide { position: absolute; z-index: 2; opacity: .88; cursor: grab; touch-action: none; }
    .guide.locked { cursor: default; opacity: .68; }
    .guide.selected { opacity: 1; filter: brightness(1.28); }
    .horizontal { right: 0; left: 0; top: var(--position); border-top: 1px dashed #20d5cc; }
    .vertical { top: 0; bottom: 0; left: var(--position); border-left: 1px dashed #20d5cc; }
    .diagonal { width: 150%; top: 50%; left: -25%; transform: translate(var(--drag-x, 0px), var(--drag-y, 0px)) rotate(var(--angle)); transform-origin: center; border-top: 1px dashed #20d5cc; }
    .menu-wrap { position: absolute; z-index: 4; top: 13px; right: 14px; width: 132px; }
    .trigger { display: grid; width: 28px; height: 28px; margin-left: auto; place-items: center; border: 1px solid #484848; border-radius: 4px; background: #151515; padding: 0; }
    .trigger svg { width: 15px; height: 15px; }
    .trigger svg [p-id="8102"] { fill: #202020; }
    .menu { width: 132px; margin-top: 5px; padding: 4px; border: 1px solid #444; border-radius: 4px; background: #292929; box-shadow: 0 10px 28px rgba(0, 0, 0, .44); }
    .item { display: block; width: 100%; min-height: 25px; border: 0; border-radius: 3px; background: transparent; color: #d4d4d4; padding: 0 6px; text-align: left; font-size: 10px; }
    .item:hover:not(:disabled) { background: #343434; }
    .item:disabled { color: #686868; cursor: default; }
    .divider { height: 1px; margin: 4px 2px; background: #3e3e3e; }
    .status { position: absolute; bottom: 13px; left: 14px; color: #8a8a8a; font-size: 10px; }
    button:focus-visible { outline: 2px solid #11c9bd; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="preview" aria-label="预览窗中的参考线菜单">
    <div class="canvas" id="canvas" aria-label="带参考线的预览画布">
      <div class="ruler-top" aria-hidden="true"></div><div class="ruler-left" aria-hidden="true"></div>
    </div>
    <div class="menu-wrap">
      <button class="trigger" type="button" aria-label="参考线" aria-expanded="true">

-55.720999-55.543706a17.729409 17.729409 0 1 0-24.947811 24.973139m111.188721 111.138066l55.720999 55.543705a17.729409 17.729409 0 1 0 24.947811-24.973139l-55.59436-55.543705a17.729409 17.729409 0 0 0-24.973139 24.973139m111.188721 111.138066l55.720999 55.543705a17.729409 17.729409 0 0 0 24.973139-24.973139l-55.720999-55.543705a17.729409 17.729409 0 0 0 24.973139 24.973139m111.239377 111.138066l55.59436 55.543705a17.729409 17.729409 0 0 0 24.973139-24.973139l-55.720999-55.594361a17.729409 17.729409 0 1 0-24.947811 24.998467" fill="#E8EBF0" p-id="8105"></path></svg>
      </button>
      <div class="menu" role="menu" aria-label="参考线菜单">
        <button class="item" id="add-horizontal" role="menuitem" type="button">添加水平参考线</button>
        <button class="item" id="add-vertical" role="menuitem" type="button">添加垂直参考线</button>
        <button class="item" id="add-diagonal" role="menuitem" type="button">添加对角参考线</button>
        <div class="divider"></div>
        <button class="item" id="lock-guide" role="menuitem" type="button">锁定参考线</button>
        <button class="item" id="clear-guides" role="menuitem" type="button">清除参考线</button>
        <button class="item" id="hide-guides" role="menuitem" type="button">隐藏参考线</button>
      </div>
    </div>
    <span class="status" id="status">参考线可拖动</span>
  </main>
  <script>
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const limits = { horizontal: 10, vertical: 10, diagonal: 2 };
    const guides = { horizontal: [], vertical: [], diagonal: [] };
    let selectedGuide = null;
    let hidden = false;

    function selectGuide(guide) {
      if (selectedGuide) selectedGuide.classList.remove('selected');
      selectedGuide = guide;
      if (guide) guide.classList.add('selected');
    }

    function updateStatus() {
      const total = Object.values(guides).flat().length;
      const allLocked = total > 0 && [...canvas.querySelectorAll('.guide')].every((guide) => guide.dataset.locked === 'true');
      status.textContent = hidden ? '参考线已隐藏' : `${total} 条参考线`;
      document.getElementById('add-horizontal').disabled = guides.horizontal.length >= limits.horizontal;
      document.getElementById('add-vertical').disabled = guides.vertical.length >= limits.vertical;
      document.getElementById('add-diagonal').disabled = guides.diagonal.length >= limits.diagonal;
      document.getElementById('lock-guide').textContent = allLocked ? '取消锁定' : '锁定参考线';
    }

    function enableDrag(guide, type) {
      guide.addEventListener('pointerdown', (event) => {
        selectGuide(guide);
        if (guide.dataset.locked === 'true') return;
        const startX = event.clientX;
        const startY = event.clientY;
        const startLeft = Number(guide.dataset.dragX || 0);
        const startTop = Number(guide.dataset.dragY || 0);
        guide.setPointerCapture(event.pointerId);
        const move = (moveEvent) => {
          const dx = moveEvent.clientX - startX;
          const dy = moveEvent.clientY - startY;
          if (type === 'horizontal') { guide.dataset.dragY = String(startTop + dy); guide.style.setProperty('--position', `calc(50% + ${guide.dataset.dragY}px)`); }
          if (type === 'vertical') { guide.dataset.dragX = String(startLeft + dx); guide.style.setProperty('--position', `calc(50% + ${guide.dataset.dragX}px)`); }
          if (type === 'diagonal') { guide.dataset.dragX = String(startLeft + dx); guide.dataset.dragY = String(startTop + dy); guide.style.setProperty('--drag-x', `${guide.dataset.dragX}px`); guide.style.setProperty('--drag-y', `${guide.dataset.dragY}px`); }
        };
        const end = () => { guide.removeEventListener('pointermove', move); guide.removeEventListener('pointerup', end); guide.removeEventListener('pointercancel', end); };
        guide.addEventListener('pointermove', move); guide.addEventListener('pointerup', end); guide.addEventListener('pointercancel', end);
      });
    }

    function addGuide(type) {
      if (guides[type].length >= limits[type]) return;
      const guide = document.createElement('i');
      guide.className = `guide ${type}`;
      guide.dataset.type = type;
      const index = guides[type].length;
      if (type === 'horizontal' || type === 'vertical') {
        const offset = index === 0 ? 0 : index * 10;
        guide.style.setProperty('--position', `calc(50% + ${offset}px)`);
        guide.dataset.dragX = type === 'vertical' ? offset : 0;
        guide.dataset.dragY = type === 'horizontal' ? offset : 0;
        if (index === 0) { guide.dataset.locked = 'true'; guide.classList.add('locked'); }
      } else {
        guide.style.setProperty('--angle', index === 0 ? '45deg' : '-45deg');
        guide.dataset.dragX = '0'; guide.dataset.dragY = '0';
      }
      guide.setAttribute('aria-label', `${type} 参考线`);
      canvas.appendChild(guide);
      guides[type].push(guide);
      enableDrag(guide, type);
      selectGuide(guide);
      updateStatus();
    }

    document.getElementById('add-horizontal').addEventListener('click', () => addGuide('horizontal'));
    document.getElementById('add-vertical').addEventListener('click', () => addGuide('vertical'));
    document.getElementById('add-diagonal').addEventListener('click', () => addGuide('diagonal'));
    document.getElementById('lock-guide').addEventListener('click', () => {
      const allLocked = [...canvas.querySelectorAll('.guide')].every((guide) => guide.dataset.locked === 'true');
      canvas.querySelectorAll('.guide').forEach((guide) => { guide.dataset.locked = String(!allLocked); guide.classList.toggle('locked', !allLocked); });
      selectGuide(null);
      updateStatus();
    });
    document.getElementById('clear-guides').addEventListener('click', () => {
      Object.values(guides).flat().forEach((guide) => guide.remove());
      Object.keys(guides).forEach((type) => { guides[type] = []; });
      selectGuide(null); updateStatus();
    });
    document.getElementById('hide-guides').addEventListener('click', (event) => { hidden = !hidden; canvas.querySelectorAll('.guide').forEach((guide) => { guide.style.visibility = hidden ? 'hidden' : 'visible'; }); event.currentTarget.textContent = hidden ? '显示参考线' : '隐藏参考线'; updateStatus(); });

    addGuide('horizontal'); addGuide('horizontal');
    addGuide('vertical'); addGuide('vertical');
    addGuide('diagonal'); addGuide('diagonal');
  </script>
</body>
</html>
