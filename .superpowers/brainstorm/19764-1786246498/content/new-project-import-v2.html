<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><style>body{background:#111;color:#ddd;font:13px -apple-system;padding:30px}.v{background:#181818;border:1px solid #414141;border-radius:8px;width:700px;margin:auto;padding:20px}.h{display:flex;border-bottom:1px solid #373737;padding-bottom:14px}.h h2{margin:0}.x{margin-left:auto;background:none;border:0;color:#aaa;font-size:18px}.sub,.hint{color:#8d8d8d;font-size:11px}.sub{margin:9px 0 18px}.row{display:grid;grid-template-columns:120px 1fr;gap:14px;margin:12px 0}.lab{padding-top:10px}.req{color:#20d5cc}.drop{min-height:94px;border:1px dashed #4c4c4c;border-radius:5px;background:#212121;padding:12px;box-sizing:border-box}.sel{background:#303030;border:1px solid #4c4c4c;color:#ddd;border-radius:4px;padding:6px 10px}.name{width:100%;background:#252525;border:1px solid #404040;color:#ddd;border-radius:4px;padding:8px;box-sizing:border-box}.f{border-top:1px solid #373737;margin-top:20px;padding-top:14px;text-align:right}.cancel{background:#303030;color:#ddd;border:1px solid #484848;border-radius:4px;padding:7px 12px}.create{background:#00c5ba;color:#07302c;border:0;border-radius:4px;padding:7px 12px;opacity:.55}</style></head><body><main class="v"><header class="h"><h2>新建项目</h2><button class="x">×</button></header><p class="sub">必须导入一条音频或视频主媒体。文案文稿可选；未导入时自动使用本地转写文本。</p><div class="row"><label class="lab">项目名称</label><input class="name" value="未命名项目"></div><div class="row"><label class="lab"><span class="req">*</span> 音频或视频</label><div class="drop"><button class="sel">选择文件</button><p class="hint">支持常见音频与视频格式。每个项目仅允许一条主媒体。</p></div></div><div class="row"><label class="lab">文案文稿（可选）</label><div class="drop"><button class="sel">选择文件</button><p class="hint">支持 TXT、MD、DOCX、PDF 等文本格式。未选择时，音视频本地转写结果将作为文案文稿使用。</p></div></div><footer class="f"><button class="cancel">取消</button> <button class="create">创建项目</button></footer></main></body></html>
