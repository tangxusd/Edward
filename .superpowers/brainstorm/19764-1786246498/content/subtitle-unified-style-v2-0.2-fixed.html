<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>Edward · 字幕统一样式</title></head><body><script>
fetch('text-properties-v1.html?key=aad9e655bc8d1bbea29d7026292a2652847bb103fb4e071cda96a491abfded2a').then(r=>r.text()).then(html=>{
  document.open();document.write(html);document.close();
  const style=document.createElement('style');style.textContent='.top{display:none!important}.app{min-height:100vh;margin:0;border:0;border-radius:0;box-shadow:none}.grid{min-height:100vh;grid-template-rows:minmax(0,1fr) 6px 270px}.key{font-size:10px!important;line-height:10px!important}.subtitle-unified{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;margin:0 -13px -12px;padding:10px 13px;border-top:1px solid #393d42;background:#1a1c1f;color:#dce1e4}.subtitle-unified button{border:0;border-radius:3px;background:#16c9c0;color:#082321;padding:4px 7px;font-size:10px;font-weight:650}';document.head.append(style);
  const apply=()=>{const panel=document.querySelector('.text-properties');if(!panel||panel.dataset.subtitleReady)return;panel.dataset.subtitleReady='true';const groups=panel.querySelectorAll('.text-group');const motion=groups[groups.length-1];motion.innerHTML='<div class="text-group-title"><span>阴影与入场动画</span><span>⌃</span></div><div class="form-row"><span>阴影</span><div class="select-field">柔和阴影 <span>⌄</span></div><span></span><i class="toggle"></i></div><div class="form-row"><span>入场</span><div class="select-field">淡入上移 <span>⌄</span></div><span></span><span></span></div>';const unified=document.createElement('div');unified.className='subtitle-unified';unified.innerHTML='<span class="subtitle-check"><i class="check">✓</i><span>统一修改所有字幕样式</span></span><button>应用至全部字幕</button>';panel.append(unified);};apply();new MutationObserver(apply).observe(document.documentElement,{childList:true,subtree:true});
});
</script></body></html>
