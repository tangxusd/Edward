<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><style>body{background:#111;color:#ddd;font:13px -apple-system;padding:30px}.v{background:#181818;border:1px solid #414141;border-radius:8px;width:700px;margin:auto;padding:20px}.h{display:flex;border-bottom:1px solid #373737;padding-bottom:14px}.h h2{margin:0}.x{margin-left:auto;color:#aaa}.sub{color:#8d8d8d;font-size:11px;margin:12px 0}.list{border:1px solid #373737;border-radius:5px;overflow:hidden}.row{display:grid;grid-template-columns:1.2fr 1fr .8fr 70px;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #333}.row:last-child{border:0}.th{background:#242424;color:#8d8d8d;font-size:11px}.online{color:#21d6a1;font-size:11px}.off{color:#aaa;font-size:11px}.btn{background:#303030;color:#ddd;border:1px solid #484848;border-radius:4px;padding:5px 8px;font-size:11px}.note{font-size:11px;color:#8d8d8d;margin-top:14px}</style></head><body><main class="v"><header class="h"><h2>设备管理</h2><span class="x">×</span></header><p class="sub">同一账号最多绑定 3 台设备，同时只允许 1 台设备处于活动使用状态。</p><section class="list"><div class="row th"><span>设备</span><span>最近使用</span><span>状态</span><span>操作</span></div><div class="row"><span>MacBook Pro</span><span>刚刚</span><span class="online">当前使用中</span><button class="btn">当前设备</button></div><div class="row"><span>Windows 工作站</span><span>昨天 16:42</span><span class="off">已离线</span><button class="btn">停用</button></div><div class="row"><span>Mac mini</span><span>8 月 6 日</span><span class="off">已离线</span><button class="btn">停用</button></div></section><p class="note">激活新设备时，如已达到上限，需要先停用一台旧设备。旧设备下次联网、触发 AI 或关键操作时将失效。</p></main></body></html>
