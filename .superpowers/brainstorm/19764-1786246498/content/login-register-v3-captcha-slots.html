<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>Edward · 账户</title><style>
body{background:#111;color:#ddd;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:30px}.v{width:420px;margin:auto;padding:22px;border:1px solid #414141;border-radius:8px;background:#181818}.h{display:flex}.h h2{margin:0}.x{margin-left:auto;border:0;background:none;color:#aaa;font-size:18px}.tabs{display:flex;gap:20px;padding-top:18px;border-bottom:1px solid #363636}.tab{padding:0 0 10px;border:0;background:none;color:#999}.tab.on{border-bottom:2px solid #20d5cc;color:#20d5cc}.panel[hidden]{display:none}.i{box-sizing:border-box;width:100%;margin-top:12px;padding:9px;border:1px solid #404040;border-radius:4px;background:#252525;color:#ddd}.captcha{display:grid;grid-template-columns:1fr 104px 26px;gap:8px;align-items:center;margin-top:12px}.captcha .i{margin:0}.captcha-image{height:34px;border:1px solid #4c5662;border-radius:4px;background:repeating-linear-gradient(135deg,#27323a 0 5px,#1a2228 5px 10px);color:#d9ffff;display:grid;place-items:center;font:italic 16px Georgia,serif;letter-spacing:3px}.refresh{padding:0;border:0;background:none;color:#20d5cc;font-size:17px}.primary{width:100%;margin-top:14px;padding:9px;border:0;border-radius:4px;background:#00c5ba;color:#07302c;font-weight:600}.split{height:1px;margin:20px 0;background:#373737}.key{display:flex;gap:7px}.key input{flex:1;margin:0}.ghost{padding:7px 10px;white-space:nowrap;border:1px solid #484848;border-radius:4px;background:#303030;color:#ddd}.bottom{margin-top:14px;color:#8d8d8d;font-size:11px}.link{color:#20d5cc}
</style></head><body><main class="v"><header class="h"><h2>账户</h2><button class="x" aria-label="关闭">×</button></header><nav class="tabs" aria-label="账户操作"><button class="tab on" data-tab="login">登录</button><button class="tab" data-tab="register">注册</button></nav><section class="panel" id="login"><input class="i" placeholder="邮箱或手机号"><input class="i" type="password" placeholder="密码"><div class="captcha"><input class="i" placeholder="图形验证码"><div class="captcha-image" aria-label="图形验证码占位">A7K2</div><button class="refresh" aria-label="刷新验证码">↻</button></div><button class="primary">登录</button><div class="split"></div><label style="font-size:11px;color:#aaa">已有 CD-KEY？（可选）</label><div class="key"><input class="i" placeholder="输入 CD-KEY"><button class="ghost">兑换</button></div><p class="bottom">登录后可管理订阅、已绑定设备和试用状态。<button class="link" style="border:0;background:none;padding:0">充值与订阅</button></p></section><section class="panel" id="register" hidden><input class="i" placeholder="邮箱或手机号"><input class="i" type="password" placeholder="设置密码"><input class="i" type="password" placeholder="确认密码"><div class="captcha"><input class="i" placeholder="图形验证码"><div class="captcha-image" aria-label="图形验证码占位">A7K2</div><button class="refresh" aria-label="刷新验证码">↻</button></div><button class="primary">下一步</button><p class="bottom">下一步需要完成短信或邮箱验证码。</p></section></main><script>const tabs=document.querySelectorAll('.tab');tabs.forEach(tab=>tab.addEventListener('click',()=>{tabs.forEach(item=>item.classList.toggle('on',item===tab));document.querySelectorAll('.panel').forEach(panel=>panel.hidden=panel.id!==tab.dataset.tab)}))</script></body></html>
