<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><style>body{background:#111;color:#ddd;font:13px -apple-system;padding:30px}.v{background:#181818;border:1px solid #414141;border-radius:8px;width:560px;margin:auto;padding:22px}.h{display:flex;border-bottom:1px solid #373737;padding-bottom:14px}.h h2{margin:0}.sub{font-size:11px;color:#8d8d8d;margin:12px 0 20px}.step{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;margin:14px 0}.dot{width:18px;height:18px;border-radius:50%;background:#303030;display:grid;place-items:center;font-size:10px;color:#aaa}.done{background:#185a56;color:#20d5cc}.running{background:#20d5cc;color:#07302c}.state{font-size:11px;color:#8d8d8d}.bar{height:5px;background:#303030;border-radius:3px;margin:5px 0 0}.bar i{display:block;width:62%;height:100%;background:#00c5ba;border-radius:3px}.cancel{margin-top:20px;background:#303030;color:#ddd;border:1px solid #484848;border-radius:4px;padding:7px 12px}.note{font-size:11px;color:#8d8d8d;margin-top:14px}</style></head><body><main class="v"><header class="h"><h2>正在生成剪辑时间线</h2></header><p class="sub">项目已创建。原始媒体仅在本地处理；云端模型只接收文本与时间戳。</p><div class="step"><i class="dot done">✓</i><div>读取媒体信息</div><span class="state">已完成</span></div><div class="step"><i class="dot running">2</i><div>本地转写并对齐字幕<div class="bar"><i></i></div></div><span class="state">62%</span></div><div class="step"><i class="dot">3</i><div>调用 GPT-4.1 进行语义分析</div><span class="state">等待中</span></div><div class="step"><i class="dot">4</i><div>生成多轨时间线</div><span class="state">等待中</span></div><button class="cancel">取消生成</button><p class="note">取消不会删除项目或导入文件，可稍后从工作台重新生成。</p></main></body></html>
