<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>初版时间线已写入 — Edward 0.2.0</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111; color: #ddd; }
    .dialog { width: min(780px, calc(100vw - 40px)); overflow: hidden; border: 1px solid #414141; border-radius: 8px; background: #181818; box-shadow: 0 22px 58px rgba(0, 0, 0, .46); }
    header { display: flex; align-items: center; gap: 10px; padding: 18px 20px; border-bottom: 1px solid #373737; }
    .state { display: grid; width: 20px; height: 20px; place-items: center; border-radius: 50%; background: #185a56; color: #20d5cc; font-size: 12px; font-weight: 700; }
    h1 { margin: 0; color: #f0f0f0; font-size: 17px; font-weight: 650; }
    .content { padding: 0 20px; }
    .intro { margin: 13px 0 18px; color: #a0a0a0; font-size: 12px; line-height: 1.6; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .item { padding: 10px; border: 1px solid #393939; border-radius: 5px; background: #242424; color: #a2a2a2; font-size: 11px; }
    .num { margin-top: 5px; color: #20d5cc; font-size: 20px; line-height: 1; }
    .list { overflow: hidden; margin-bottom: 18px; border: 1px solid #373737; border-radius: 5px; }
    .row { display: grid; grid-template-columns: 74px minmax(0, 1fr) 92px 100px; gap: 10px; min-height: 39px; align-items: center; padding: 0 10px; border-bottom: 1px solid #333; font-size: 12px; }
    .row:last-child { border-bottom: 0; }
    .head { min-height: 32px; background: #242424; color: #8d8d8d; font-size: 11px; }
    footer { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid #373737; background: #171717; }
    .spinner { width: 12px; height: 12px; border: 2px solid #3d7f7a; border-right-color: #20d5cc; border-radius: 50%; }
    .entering { color: #d9d9d9; font-size: 12px; }
    .note { margin-left: auto; color: #8d8d8d; font-size: 11px; }
  </style>
</head>
<body>
  <main class="dialog" role="status" aria-live="polite" aria-labelledby="result-title">
    <header>
      <span class="state" aria-hidden="true">✓</span>
      <h1 id="result-title">初版时间线已写入</h1>
    </header>
    <div class="content">
      <p class="intro">已将主媒体、字幕和本地可用的匹配组件写入项目时间线。原始 AI 分析结果已随项目保存，进入工作台后可按正常剪辑流程继续修改。</p>
      <section class="summary" aria-label="初版内容统计">
        <div class="item">字幕片段<div class="num">18</div></div>
        <div class="item">卡片组件<div class="num">5</div></div>
        <div class="item">图表组件<div class="num">2</div></div>
      </section>
      <section class="list" aria-label="已写入时间线的内容">
        <div class="row head"><span>时间</span><span>内容</span><span>轨道</span><span>本地资源</span></div>
        <div class="row"><span>00:00:00</span><span>开场核心观点</span><span>V2 / V3</span><span>数据亮点</span></div>
        <div class="row"><span>00:00:08</span><span>关键结论说明</span><span>V2 / V3</span><span>趋势曲线</span></div>
        <div class="row"><span>00:00:16</span><span>行动建议</span><span>V2 / V3</span><span>关键词强调</span></div>
      </section>
    </div>
    <footer>
      <span class="spinner" aria-hidden="true"></span>
      <span class="entering">正在进入工作台</span>
      <span class="note">无需手动应用</span>
    </footer>
  </main>
</body>
</html>
