<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><style>body{background:#111;color:#ddd;font:13px -apple-system;padding:30px}.v{background:#181818;border:1px solid #414141;border-radius:8px;width:620px;margin:auto;padding:20px}.h{display:flex;border-bottom:1px solid #373737;padding-bottom:14px}.h h2{margin:0}.x{margin-left:auto;background:none;border:0;color:#aaa;font-size:18px}.sub{color:#8d8d8d;font-size:11px;margin:10px 0 18px}.row{display:grid;grid-template-columns:105px 1fr;gap:14px;margin:14px 0;align-items:center}.i{width:100%;box-sizing:border-box;background:#252525;border:1px solid #404040;color:#ddd;border-radius:4px;padding:8px}.hint{font-size:11px;color:#8d8d8d;margin-top:5px}.foot{border-top:1px solid #373737;margin-top:20px;padding-top:14px;display:flex;justify-content:space-between}.cancel,.test{background:#303030;color:#ddd;border:1px solid #484848;border-radius:4px;padding:7px 12px}.save{background:#00c5ba;color:#07302c;border:0;border-radius:4px;padding:7px 14px}.danger{color:#d88762;font-size:11px}</style></head><body><main class="v"><header class="h"><h2>添加大模型</h2><button class="x">×</button></header><p class="sub">添加 OpenAI 兼容接口配置。API Key 仅保存于本机，不写入项目文件。</p><div class="row"><label>名称</label><input class="i" placeholder="例如：主力模型"></div><div class="row"><label>接口地址</label><div><input class="i" placeholder="https://api.example.com/v1"><div class="hint">OpenAI 兼容 API 的基础地址</div></div></div><div class="row"><label>模型标识</label><input class="i" placeholder="例如：gpt-4.1"></div><div class="row"><label>API Key</label><input class="i" placeholder="输入 API Key" type="password"></div><div class="row"><label>测试状态</label><span class="danger">尚未测试</span></div><footer class="foot"><button class="cancel">取消</button><div><button class="test">测试连接</button> <button class="save">保存</button></div></footer></main></body></html>
