<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>Edward · 我的组件库</title><link rel="stylesheet" href="resource-tab-style.css"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:#111;color:#ddd;font-size:12px}.panel{width:min(720px,calc(100vw - 40px));margin:10vh auto;overflow:hidden;border:1px solid #3a3a3a;border-radius:7px;background:#1d1d1d}.content{display:grid;grid-template-columns:142px 1fr;min-height:350px}.groups{padding:12px 9px;border-right:1px solid #303030;background:#191919}.group{margin-bottom:8px;padding:9px 10px;border-radius:4px;color:#aaa}.group.active{background:#303030;color:#20d5cc;font-weight:600}.main{padding:14px}.search{width:100%;margin:0 0 12px;border:1px solid #404040;border-radius:4px;padding:7px 9px;background:#252525;color:#ddd;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.item{position:relative;min-width:0;border-radius:6px;padding:8px;background:#393939}.thumb{display:grid;height:80px;place-items:center;border-radius:4px;background:linear-gradient(135deg,#356e9e,#84527b);font-size:16px}.name{overflow:hidden;padding-right:14px;margin-top:7px;font-size:11px;font-weight:600;white-space:nowrap;text-overflow:ellipsis}.bottom{display:flex;align-items:center;margin-top:5px;color:#aaa;font-size:10px}.action{width:21px;height:21px;margin-left:auto;border:0;border-radius:50%;background:#242424;color:#ddd;font-size:12px}.delete{position:absolute;right:7px;top:7px;width:10px;height:10px;border:0;border-radius:50%;padding:0;background:#242424;color:#d88762;font-size:9px;line-height:8px}
</style></head><body><main class="panel" aria-label="我的组件库"><nav class="tabs resource-tabs" aria-label="组件分类"><button class="tab active"><svg viewBox="0 0 1024 1024"><use href="resource-tab-icons.svg#card"/></svg><span>卡片</span></button><button class="tab"><svg viewBox="0 0 1024 1024"><use href="resource-tab-icons.svg#chart"/></svg><span>图表</span></button><button class="tab"><svg viewBox="0 0 1024 1024"><use href="resource-tab-icons.svg#background"/></svg><span>背景</span></button><button class="tab"><svg viewBox="0 0 1024 1024"><use href="resource-tab-icons.svg#annotation"/></svg><span>标注</span></button><button class="tab number"><svg viewBox="0 0 1024 1024"><use href="resource-tab-icons.svg#number"/></svg><span>数字</span></button></nav><section class="content"><aside class="groups"><div class="group active">我的</div></aside><section class="main"><input class="search" placeholder="搜索我的组件"><section class="grid"><article class="item"><button class="delete" aria-label="删除数据重点卡片">×</button><div class="thumb">数据亮点</div><div class="name">数据重点卡片</div><div class="bottom"><span>刚刚保存</span><button class="action" aria-label="添加到时间线">+</button></div></article><article class="item"><button class="delete" aria-label="删除深色标题卡">×</button><div class="thumb" style="background:linear-gradient(135deg,#55396a,#36605a)">标题</div><div class="name">深色标题卡</div><div class="bottom"><span>个人生成</span><button class="action" aria-label="添加到时间线">+</button></div></article></section></section></section></main></body></html>
