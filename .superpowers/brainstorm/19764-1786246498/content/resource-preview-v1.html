<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><style>body{background:#111;color:#ddd;font:13px -apple-system;padding:30px}.v{background:#181818;border:1px solid #414141;border-radius:8px;width:820px;margin:auto;padding:20px}.h{display:flex;border-bottom:1px solid #373737;padding-bottom:14px}.h h2{margin:0}.x{margin-left:auto;background:none;border:0;color:#aaa;font-size:18px}.shell{display:grid;grid-template-columns:1fr 220px;gap:18px;margin-top:16px}.stage{aspect-ratio:16/9;background:#090909;border:1px solid #363636;position:relative;display:grid;place-items:center}.card{width:220px;height:110px;background:linear-gradient(135deg,#356e9e,#84527b);border-radius:6px;display:grid;place-items:center;font-size:20px}.badge{position:absolute;bottom:10px;left:10px;background:#000b;padding:5px 8px;border-radius:4px;font-size:11px}.info{background:#242424;border:1px solid #373737;border-radius:5px;padding:12px}.line{border-bottom:1px solid #353535;padding:10px 0;color:#aaa}.value{color:#ddd;float:right}.upgrade{width:100%;margin-top:14px;background:#00c5ba;color:#07302c;border:0;border-radius:4px;padding:8px;font-weight:600}.note{font-size:11px;color:#8d8d8d;margin-top:12px}</style></head><body><main class="v"><header class="h"><h2>资源预览</h2><button class="x">×</button></header><div class="shell"><section class="stage"><div class="card">数据亮点</div><span class="badge">▶ 动画预览中</span></section><aside class="info"><b>数据亮点</b><div class="line">分类 <span class="value">卡片</span></div><div class="line">画幅 <span class="value">16:9 / 9:16</span></div><div class="line">动画 <span class="value">入场</span></div><button class="upgrade">升级资源</button><p class="note">升级后下载至本地资源库，可在工作台卡片栏中使用。</p></aside></div></main></body></html>
