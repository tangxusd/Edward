<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时间线裁剪 — Edward 0.2.0</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#111;color:#d6d6d6;font-size:12px}.timeline{width:min(960px,calc(100vw - 40px));border:1px solid #393939;border-radius:6px;overflow:hidden;background:#171717}.tools{height:31px;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid #303030;color:#9f9f9f;font-size:10px}.tools b{color:#20d5cc}.range{margin-left:auto;color:#8d8d8d}.scale{display:grid;grid-template-columns:78px 1fr;height:27px}.corner{display:grid;place-items:center;border-right:1px solid #373737;border-bottom:1px solid #373737;color:#858585;font-size:10px}.ruler{position:relative;border-bottom:1px solid #373737;background:repeating-linear-gradient(to right,transparent 0 8px,#494949 8px 9px,transparent 9px 16px),repeating-linear-gradient(to right,transparent 0 63px,#6a6a6a 63px 64px,transparent 64px 128px)}.times{display:flex;justify-content:space-between;padding:3px 10px;color:#858585;font-size:9px}.lane{display:grid;grid-template-columns:78px 1fr;height:48px;border-bottom:1px solid #2b2b2b}.label{display:grid;place-items:center;border-right:1px solid #353535;color:#aaa}.track{position:relative;background:#191919}.clip{position:absolute;top:8px;left:14%;width:62%;height:31px;border:1px solid #1bd4c9;border-radius:3px;background:#356e9e;color:#edfafa;line-height:29px;padding-left:14px;font-size:10px}.clip.audio{top:8px;background:#496a9b;background-image:linear-gradient(135deg,transparent 0 13%,rgba(255,255,255,.28) 14% 15%,transparent 16% 29%,rgba(255,255,255,.28) 30% 31%,transparent 32%)}.handle{position:absolute;z-index:2;top:-5px;width:2px;height:39px;border-radius:2px;background:#eaffff;cursor:ew-resize}.handle.left{left:-1px}.handle.right{right:-1px}.playhead{position:absolute;z-index:4;top:-27px;bottom:0;left:46%;border-left:1px solid #f4f4f4}.playhead:before{content:"";position:absolute;top:0;left:-4px;width:7px;height:7px;border:1px solid #f4f4f4;background:#252525}.note{padding:9px 12px;color:#8c8c8c;font-size:10px}.note b{color:#20d5cc;font-weight:600}</style></head><body><main class="timeline" aria-label="时间线裁剪状态"><header class="tools"><b>选择</b><span>分割</span><span>吸附</span><span>链接</span><span class="range">工程入点　工程出点　整条时间线</span></header><div class="scale"><div class="corner">Edward</div><div class="ruler"><div class="times"><span>00:00</span><span>00:00:01</span><span>00:00:02</span><span>00:00:03</span></div></div></div><section class="lanes"><i class="playhead" aria-label="播放头"></i><div class="lane"><span class="label">V1</span><div class="track"><div class="clip" aria-label="可裁剪主视频"><i class="handle left" aria-label="左侧裁剪手柄"></i>主视频素材<i class="handle right" aria-label="右侧裁剪手柄"></i></div></div></div><div class="lane"><span class="label">A1</span><div class="track"><div class="clip audio" aria-label="链接的原始音频"><i class="handle left" aria-label="左侧裁剪手柄"></i>原始音频<i class="handle right" aria-label="右侧裁剪手柄"></i></div></div></div></section><footer class="note"><b>左右手柄</b> 可裁剪片段；到达原始素材可用源范围即停止。</footer></main></body></html>
