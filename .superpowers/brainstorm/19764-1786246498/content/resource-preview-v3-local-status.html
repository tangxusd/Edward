<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>Edward · 资源预览</title><style>
body{background:#111;color:#ddd;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:30px}.v{width:820px;margin:auto;padding:20px;border:1px solid #414141;border-radius:8px;background:#181818}.h{display:flex;padding-bottom:14px;border-bottom:1px solid #373737}.h h2{margin:0}.x{margin-left:auto;border:0;background:none;color:#aaa;font-size:18px}.shell{display:grid;grid-template-columns:1fr 220px;gap:18px;margin-top:16px}.stage{position:relative;display:grid;place-items:center;aspect-ratio:16/9;border:1px solid #363636;background:#090909;overflow:hidden}.card{width:220px;height:110px;border-radius:6px;background:linear-gradient(135deg,#356e9e,#84527b);display:grid;place-items:center;font-size:20px;animation:card-enter 2.4s cubic-bezier(.2,.7,.2,1) infinite alternate}.badge{position:absolute;bottom:10px;left:10px;padding:5px 8px;border-radius:4px;background:#000b;font-size:11px}.info{padding:12px;border:1px solid #373737;border-radius:5px;background:#242424}.line{padding:10px 0;border-bottom:1px solid #353535;color:#aaa}.value{float:right;color:#ddd}.download{width:100%;margin-top:14px;padding:8px;border:0;border-radius:4px;background:#00c5ba;color:#07302c;font-weight:600}.download.is-downloaded{background:#5a5a5a;color:#c5c5c5;cursor:default}.note{margin-top:12px;color:#8d8d8d;font-size:11px}@keyframes card-enter{0%{opacity:.28;transform:translateY(18px) scale(.96)}42%,100%{opacity:1;transform:translateY(0) scale(1)}}
</style></head><body><main class="v"><header class="h"><h2>资源预览</h2><button class="x" aria-label="关闭">×</button></header><div class="shell"><section class="stage" aria-label="资源动画演示"><div class="card">数据亮点</div><span class="badge">动画预览中</span></section><aside class="info"><b>数据亮点</b><div class="line">分类 <span class="value">卡片</span></div><div class="line">画幅 <span class="value">16:9 / 9:16</span></div><div class="line">动画 <span class="value">入场</span></div><button class="download is-downloaded" disabled>下载资源</button><p class="note">本地资源库已有此资源。</p></aside></div></main></body></html>
