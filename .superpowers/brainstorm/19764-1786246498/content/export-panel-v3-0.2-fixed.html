<html lang="zh-CN"><head><meta charset="UTF-8"><title>Edward · 导出</title><style>
body{background:#111;color:#ddd;font:13px -apple-system;padding:30px}.v{width:680px;margin:auto;padding:20px;border:1px solid #414141;border-radius:8px;background:#181818}.h{display:flex;padding-bottom:14px;border-bottom:1px solid #373737}.h h2{margin:0}.x{margin-left:auto;border:0;background:none;color:#aaa;font-size:18px}.row{display:grid;grid-template-columns:105px 1fr;gap:14px;align-items:center;margin:14px 0}.s,.i{border:1px solid #404040;border-radius:4px;background:#252525;color:#ddd;padding:8px}.s{display:inline-block;margin-right:7px}.i{width:100%;box-sizing:border-box}.choose{border:1px solid #4a4a4a;border-radius:4px;background:#303030;color:#ddd;padding:7px 10px}.path,.hint{margin-top:7px;color:#8d8d8d;font-size:11px}.bar{height:5px;border-radius:3px;background:#303030}.foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:14px;border-top:1px solid #373737}.cancel{border:1px solid #484848;border-radius:4px;background:#303030;color:#ddd;padding:7px 12px}.go{border:0;border-radius:4px;background:#00c5ba;color:#07302c;padding:7px 14px}
