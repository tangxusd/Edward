2><p>按参考图使用密集小刻度、固定轨道头、帧级时间标尺、白色播放头和紧凑轨道高度。</p><div class="p"><div class="canvas"><div class="hr">0　480　960　1440　1920</div><div class="vr">1080<br><br><br>720<br><br><br>360<br><br><br>0</div></div><section class="time"><div class="toolbar">＋　选择　撤销　重做　分割　删除　　　　　　　　　　　　　　　吸附　联动　缩放</div><div class="tr">00:00　　00:00:01　　00:00:02　　00:00:03　　00:00:04</div><div class="playhead"></div><div class="track"><span class="head">V3　字幕</span><span class="clip c3">字幕片段</span></div><div class="track"><span class="head">V2　卡片</span><span class="clip c2">卡片组件</span></div><div class="track"><span class="head">V1　视频</span><span class="clip">主视频</span></div><div class="track"><span class="head">A1　音频</span><span class="wave"></span></div></section></div></body></html>
