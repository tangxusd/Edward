<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新建项目导入 — Edward 0.2.0</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111; color: #ddd; }
    .dialog { width: min(720px, calc(100vw - 40px)); border: 1px solid #414141; border-radius: 8px; background: #181818; box-shadow: 0 22px 58px rgba(0,0,0,.46); }
    .dialog-header { display: flex; align-items: center; padding: 19px 20px 14px; border-bottom: 1px solid #373737; }
    h1 { margin: 0; color: #f0f0f0; font-size: 17px; font-weight: 650; }
    .close { margin-left: auto; border: 0; background: transparent; color: #aaa; font-size: 18px; line-height: 1; }
    .content { padding: 0 20px; }
    .intro { margin: 13px 0 17px; color: #a0a0a0; font-size: 12px; line-height: 1.65; }
    .row { display: grid; grid-template-columns: 126px 1fr; gap: 14px; margin: 12px 0; }
    label { padding-top: 9px; color: #d5d5d5; font-size: 13px; }
    .required { color: #20d5cc; }
    .input { width: 100%; min-height: 35px; padding: 0 9px; border: 1px solid #404040; border-radius: 4px; background: #252525; color: #ddd; font: inherit; }
    .drop { min-height: 100px; padding: 12px; border: 1px dashed #4c4c4c; border-radius: 5px; background: #212121; }
    .select { min-height: 29px; padding: 0 10px; border: 1px solid #4c4c4c; border-radius: 4px; background: #303030; color: #e4e4e4; font: 12px inherit; }
    .hint { margin: 9px 0 0; color: #8d8d8d; font-size: 11px; line-height: 1.55; }
    .status { margin: 5px 0 0 140px; color: #7f9e9d; font-size: 11px; line-height: 1.55; }
    footer { margin-top: 18px; padding: 14px 20px; border-top: 1px solid #373737; text-align: right; }
    .cancel, .create { min-height: 31px; padding: 0 12px; border-radius: 4px; font: 12px inherit; }
    .cancel { border: 1px solid #484848; background: #303030; color: #ddd; }
    .create { margin-left: 7px; border: 0; background: #00c5ba; color: #07302c; font-weight: 700; }
    .create:disabled { cursor: not-allowed; opacity: .55; }
    button:focus-visible, input:focus-visible { outline: 2px solid #11c9bd; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <header class="dialog-header">
      <h1 id="dialog-title">新建项目</h1>
      <button class="close" type="button" aria-label="关闭新建项目窗口">×</button>
    </header>
    <div class="content">
      <p class="intro">必须导入一条音频或视频主媒体。文案文稿可选；未导入时自动使用本地转写文本。</p>
      <div class="row">
        <label for="project-name">项目名称</label>
        <input id="project-name" class="input" value="未命名项目" aria-label="项目名称">
      </div>
      <div class="row">
        <label><span class="required">*</span> 音频或视频</label>
        <div class="drop">
          <button class="select" type="button">选择文件</button>
          <p class="hint">以实际媒体探测结果判断是否可导入；每个项目仅允许一条主媒体。视频含多条音轨时，首条作为主音频，其余音轨将自动导入。</p>
        </div>
      </div>
      <div class="row">
        <label>文案文稿（可选）</label>
        <div class="drop">
          <button class="select" type="button">选择文件</button>
          <p class="hint">支持 TXT、Markdown、DOCX、可复制文本 PDF 和 SRT；不支持扫描版 PDF 的 OCR。未选择时，主媒体的本地转写结果将作为文案来源。</p>
        </div>
      </div>
      <p class="status">本地转写仅支持中文和英文；创建项目需要在线且已配置可用的云端模型。语义分析只读取文稿和转写文本，不提取视频关键帧。</p>
    </div>
    <footer>
      <button class="cancel" type="button">取消</button>
      <button class="create" type="button" disabled>创建项目</button>
    </footer>
  </main>
</body>
</html>
