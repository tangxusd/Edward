<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><style>body{background:#111;color:#ddd;font:13px -apple-system;padding:30px}.veil{background:#181818;border:1px solid #414141;border-radius:8px;width:700px;margin:auto;box-shadow:0 20px 50px #000;padding:20px}.head{display:flex;align-items:center;border-bottom:1px solid #373737;padding-bottom:14px}.head h2{margin:0;font-size:17px}.close{margin-left:auto;background:none;border:0;color:#aaa;font-size:18px}.sub{color:#8d8d8d;font-size:11px;margin:9px 0 18px}.row{display:grid;grid-template-columns:120px 1fr;gap:14px;margin:12px 0;align-items:start}.label{padding-top:10px}.required{color:#20d5cc}.drop{min-height:94px;border:1px dashed #4c4c4c;border-radius:5px;background:#212121;padding:12px;box-sizing:border-box}.select{background:#303030;border:1px solid #4c4c4c;color:#ddd;border-radius:4px;padding:6px 10px}.hint{color:#858585;font-size:11px;margin-top:8px}.file{margin-top:9px;background:#292929;border-radius:4px;padding:8px;display:flex;justify-content:space-between}.foot{border-top:1px solid #373737;margin-top:20px;padding-top:14px;display:flex;justify-content:flex-end;gap:8px}.cancel{background:#303030;color:#ddd;border:1px solid #484848;border-radius:4px;padding:7px 12px}.create{background:#00c5ba;color:#07302c;border:0;border-radius:4px;padding:7px 12px;opacity:.55}.name{width:100%;box-sizing:border-box;background:#252525;border:1px solid #404040;color:#ddd;border-radius:4px;padding:8px}</style></head><body><main class="veil"><header class="head"><h2>新建项目</h2><button class="close">×</button></header><p class="sub">导入一条音频或视频主媒体，以及一份文案文稿。两个文件均为必填项。</p><div class="row"><label class="label">项目名称</label><input class="name" value="未命名项目"></div><div class="row"><label class="label"><span class="required">*</span> 音频或视频</label><div class="drop"><button class="select">选择文件</button><div class="hint">支持常见音频与视频格式。每个项目仅允许一条主媒体。</div></div></div><div class="row"><label class="label"><span class="required">*</span> 文案文稿</label><div class="drop"><button class="select">选择文件</button><div class="hint">支持 TXT、MD、DOCX、PDF 等常见文本格式。</div></div></div><footer class="foot"><button class="cancel">取消</button><button class="create">创建项目</button></footer></main></body></html>
