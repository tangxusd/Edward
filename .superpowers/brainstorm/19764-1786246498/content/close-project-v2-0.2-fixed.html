<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关闭当前项目 — Edward 0.2.0</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111; color: #ddd; }
    .dialog { width: min(410px, calc(100vw - 40px)); overflow: hidden; border: 1px solid #414141; border-radius: 8px; background: #181818; box-shadow: 0 22px 58px rgba(0, 0, 0, .46); }
    header { padding: 19px 20px 16px; border-bottom: 1px solid #373737; }
    h1 { margin: 0; color: #f0f0f0; font-size: 16px; font-weight: 650; }
    .content { padding: 16px 20px 18px; }
    p { margin: 0; color: #b2b2b2; font-size: 12px; line-height: 1.65; }
    .notice { margin-top: 12px; padding: 9px 10px; border: 1px solid #3d4d4c; border-radius: 4px; background: #1d2928; color: #adcfcc; font-size: 11px; line-height: 1.55; }
    footer { display: flex; justify-content: flex-end; gap: 8px; padding: 13px 20px; border-top: 1px solid #373737; }
    button { min-height: 31px; padding: 0 12px; border-radius: 4px; font: 12px inherit; }
    .cancel { border: 1px solid #484848; background: #303030; color: #ddd; }
    .close { border: 0; background: #00c5ba; color: #07302c; font-weight: 600; }
    button:focus-visible { outline: 2px solid #11c9bd; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="dialog" role="dialog" aria-modal="true" aria-labelledby="close-title" aria-describedby="close-copy close-notice">
    <header><h1 id="close-title">关闭当前项目？</h1></header>
    <div class="content">
      <p id="close-copy">关闭后将先完整保存当前工程，再返回首页。返回首页后才可以创建项目或打开其他历史项目。</p>
      <p class="notice" id="close-notice">若完整保存失败，项目会保持打开状态，不会离开当前工作台。</p>
    </div>
    <footer>
      <button class="cancel" type="button">取消</button>
      <button class="close" type="button">保存并关闭</button>
    </footer>
  </main>
</body>
</html>
