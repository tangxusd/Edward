<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>剪辑软件 Logo — 靛紫粉渐变（macOS 玻璃按钮质感）</title>
  <desc>剪刀图标完整保留原始路径数据，旋转45度使刀口朝右上角；底板采用 macOS 风格连续曲线圆角（squircle），叠加顶部镜面高光、底部厚度暗影、玻璃边缘亮线与整体浮起投影，呈现立体按钮质感</desc>
  <defs>
    <!-- 底板三色渐变（保留原配色） -->
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <!-- 顶部镜面高光：玻璃受光面 -->
    <linearGradient id="glossGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 左侧边缘补光：增强球面感 -->
    <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 底部厚度暗影：键帽下缘 -->
    <radialGradient id="baseShadeGrad" cx="50%" cy="100%" r="95%">
      <stop offset="42%" stop-color="#0F172A" stop-opacity="0"/>
      <stop offset="72%" stop-color="#0F172A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.38"/>
    </radialGradient>
    <!-- 底部玻璃反光带：细亮边 -->
    <linearGradient id="bottomReflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <!-- 玻璃边缘亮线：上亮下暗 -->
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.68"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <!-- 整块图标浮起投影：按钮离开壁纸 -->
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="34" stdDeviation="46" flood-color="#1E1B4B" flood-opacity="0.34"/>
    </filter>
    <!-- 剪刀贴面轻投影：图形浮于玻璃表面 -->
    <filter id="scissorShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.30"/>
    </filter>
    <!-- macOS 连续曲线圆角裁剪区 -->
    <clipPath id="squircleClip">
      <path d="M512 88C664.6 88 697.5 92.4 744.6 104.6C791.7 116.8 821.9 133.7 851.1 157.6C880.2 181.5 900.8 206.2 915.7 244.7C930.6 283.3 936 311 936 435.8L936 588.2C936 713 930.6 740.7 915.7 779.3C900.8 817.8 880.2 842.5 851.1 866.4C821.9 890.3 791.7 907.2 744.6 919.4C697.5 931.6 664.6 936 512 936C359.4 936 326.5 931.6 279.4 919.4C232.3 907.2 202.1 890.3 172.9 866.4C143.8 842.5 123.2 817.8 108.3 779.3C93.4 740.7 88 713 88 588.2L88 435.8C88 311 93.4 283.3 108.3 244.7C123.2 206.2 143.8 181.5 172.9 157.6C202.1 133.7 232.3 116.8 279.4 104.6C326.5 92.4 359.4 88 512 88Z"/>
    </clipPath>
  </defs>
  <!-- 整块图标（含浮起投影） -->
  <!-- Qt SVG 渲染器会把外部投影滤镜的扩展区域栅格化为不透明灰色边框；
       保留图标本体与玻璃层，移除外部投影，确保在 Edward 深色 rail 上透明显示。 -->
  <g>
    <!-- 彩色圆角底板：保留正式 Logo 本体；底板外部不绘制任何背景 -->
    <path d="M512 88C664.6 88 697.5 92.4 744.6 104.6C791.7 116.8 821.9 133.7 851.1 157.6C880.2 181.5 900.8 206.2 915.7 244.7C930.6 283.3 936 311 936 435.8L936 588.2C936 713 930.6 740.7 915.7 779.3C900.8 817.8 880.2 842.5 851.1 866.4C821.9 890.3 791.7 907.2 744.6 919.4C697.5 931.6 664.6 936 512 936C359.4 936 326.5 931.6 279.4 919.4C232.3 907.2 202.1 890.3 172.9 866.4C143.8 842.5 123.2 817.8 108.3 779.3C93.4 740.7 88 713 88 588.2L88 435.8C88 311 93.4 283.3 108.3 244.7C123.2 206.2 143.8 181.5 172.9 157.6C202.1 133.7 232.3 116.8 279.4 104.6C326.5 92.4 359.4 88 512 88Z" fill="url(#bgGrad)"/>
    <g clip-path="url(#squircleClip)">
      <ellipse cx="512" cy="40" rx="780" ry="360" fill="url(#glossGrad)"/>
      <rect x="88" y="80" width="200" height="870" fill="url(#sideGrad)"/>
    </g>
    <!-- 剪刀：路径逐字保留，纯白贴面 -->
    <g transform="translate(512 512) rotate(45) scale(0.88) translate(-497 -410)" fill="#FFFFFF">
      <path d="M652.8 793.6c-63.5136 0-115.2-51.6736-115.2-115.2s51.6864-115.2 115.2-115.2 115.2 51.6736 115.2 115.2-51.6864 115.2-115.2 115.2z m0-204.8c-49.408 0-89.6 40.2048-89.6 89.6s40.192 89.6 89.6 89.6 89.6-40.2048 89.6-89.6-40.192-89.6-89.6-89.6z"/>
      <path d="M652.8 742.4c-35.2896 0-64-28.7104-64-64s28.7104-64 64-64 64 28.7104 64 64-28.7104 64-64 64z m0-102.4c-21.1712 0-38.4 17.2288-38.4 38.4s17.2288 38.4 38.4 38.4 38.4-17.2288 38.4-38.4-17.2288-38.4-38.4-38.4zM550.1568 642.7648L260.0832 279.7312a136.448 136.448 0 0 1-27.4944-109.5808l24.1664-134.0288a12.8 12.8 0 0 1 23.2576-4.8256l357.8496 537.3312-21.312 14.1952L276.3008 71.936l-18.5344 102.7584a110.8864 110.8864 0 0 0 22.2976 89.0368l290.0864 363.0464-19.9936 15.9872zM371.2 793.6c-63.5136 0-115.2-51.6736-115.2-115.2s51.6864-115.2 115.2-115.2 115.2 51.6736 115.2 115.2-51.6864 115.2-115.2 115.2z m0-204.8c-49.408 0-89.6 40.2048-89.6 89.6s40.192 89.6 89.6 89.6 89.6-40.2048 89.6-89.6-40.192-89.6-89.6-89.6z"/>
      <path d="M371.2 742.4c-35.2896 0-64-28.7104-64-64s28.7104-64 64-64 64 28.7104 64 64-28.7104 64-64 64z m0-102.4c-21.1712 0-38.4 17.2288-38.4 38.4s17.2288 38.4 38.4 38.4 38.4-17.2288 38.4-38.4-17.2288-38.4-38.4-38.4zM522.6624 409.856l-21.312-14.1952L744 31.296a12.928 12.928 0 0 1 13.2608-5.44c5.1072 1.0624 9.0624 5.12 9.9968 10.2656l24.1664 134.0288a136.4992 136.4992 0 0 1-27.4944 109.5936l-24.3968 30.4896-19.9936-16 24.3968-30.4896a110.8864 110.8864 0 0 0 22.2976-89.0368L747.6992 71.936l-225.0368 337.92z"/>
      <path d="M700.5568 317.9648l19.9936 16-20.8256 26.0096-19.9808-16zM661.4528 366.8736l19.9808 16-97.152 121.3696-19.9808-16zM501.9776 566.1824l20.0448 15.9232-48.2176 60.672-20.0448-15.9232zM439.0656 489.1904l21.312 14.208-52.9408 79.4368-21.312-14.208zM499.2 473.6h23.4624v25.6H499.2z"/>
    </g>
  </g>
</svg>
